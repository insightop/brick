name: Sync upstream

# 每周检测上游 GetDutchie/brick 的 main 是否有新提交。
# 若有：基于 patch 合入上游，推送到临时分支 sync-from-upstream/main，
#       并创建/更新一个目标为 patch 的 PR，由维护者手动 review & 合并。
#
# 注意：
# - 本 workflow **不修改 main 以外的任何受保护分支**，main 自身也不被改动。
# - 定时任务只能在默认分支（main）上生效，因此本文件必须存在于 main。
# - 已存在的 PR 会被 force-push 自动更新（策略 A）。
on:
  schedule:
    # 01:00 UTC 每周一 = 09:00 Asia/Shanghai / Asia/Hong_Kong
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Sync upstream/main into patch
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout patch
        uses: actions/checkout@v7
        with:
          ref: patch
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/GetDutchie/brick.git
          git fetch --no-tags upstream main

      - name: Detect upstream updates
        id: detect
        run: |
          behind=$(git rev-list --count HEAD..upstream/main)
          echo "behind=$behind" >> "$GITHUB_OUTPUT"
          if [ "$behind" -eq 0 ]; then
            echo "::notice::patch is up to date with upstream/main. Nothing to do."
          else
            echo "::notice::upstream/main is ahead of patch by $behind commit(s)."
          fi

      - name: Build sync branch
        if: steps.detect.outputs.behind != '0'
        run: |
          git switch -c sync-from-upstream/main
          git merge --no-edit upstream/main

      - name: Push sync branch
        if: steps.detect.outputs.behind != '0'
        run: |
          # 复用同名分支：force-push 会同时更新已存在的 PR（策略 A）
          git push --force origin sync-from-upstream/main

      - name: Create or update pull request
        if: steps.detect.outputs.behind != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: sync-from-upstream/main
          BASE_BRANCH: patch
        run: |
          set -euo pipefail

          commits=$(git log --no-merges --pretty='- %h %s' patch..upstream/main)

          {
            echo "自动同步上游 [\`GetDutchie/brick\`](https://github.com/GetDutchie/brick) 的 \`main\` 到本 fork 的 \`patch\`。"
            echo
            echo "本 PR 由 \`Sync upstream\` workflow 生成，**需要维护者手动 review 并合并**。"
            echo
            echo "### 上游新增提交"
            echo
            echo "$commits"
            echo
            echo "---"
            echo
            echo "合并后请确认 fork 的 \`patch\` 仍能正常用于依赖构建。"
          } > /tmp/pr-body.md

          if gh pr list --head "$HEAD_BRANCH" --base "$BASE_BRANCH" --state open --json number --jq 'length' | grep -q '^0$'; then
            gh pr create \
              --base "$BASE_BRANCH" \
              --head "$HEAD_BRANCH" \
              --title "chore: sync upstream/main into patch" \
              --body-file /tmp/pr-body.md
          else
            echo "::notice::An open PR for $HEAD_BRANCH already exists; it has been updated by the force-push."
            gh pr list --head "$HEAD_BRANCH" --base "$BASE_BRANCH" --state open --json url --jq '.[].url'
          fi
